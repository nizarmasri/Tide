[package]
name = "tide-core"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
name = "tide_core"
crate-type = ["staticlib", "lib"]

[features]
# Integration tests that drive a real aria2c binary.
it = []

[dependencies]
uniffi = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30"
rayon = "1.12"
sha1 = "0.11"
crossbeam-channel = "0.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
